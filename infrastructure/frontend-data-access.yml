# Define dataset read access and download-notification publishing for the frontend.
# Inputs: ReportsBucket and the shared demoHistoryPrefix setting in serverless.yml.
# Outputs: non-secret connection settings, the service user, and its managed policy ARN.
# Generate access keys separately so credentials never enter templates or stack outputs.
Resources:
  FrontendHistoryReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read synthetic S3 history and publish report-download events to one SNS topic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: '${ReportsBucket.Arn}/${self:custom.demoHistoryPrefix}/*'
          # Grant publishing to this stack's notification topic only.
          - Effect: Allow
            Action: sns:Publish
            Resource:
              Ref: ReportDownloadTopic

  # Give the hosted frontend its own programmatic identity, without a console password.
  # Include stage and region because IAM user names are unique across the AWS account.
  FrontendHistoryServiceUser:
    Type: AWS::IAM::User
    Properties:
      UserName: service-account-serverless-api-usage-${sls:stage}-${aws:region}
      Path: /service-accounts/
      ManagedPolicyArns:
        - Ref: FrontendHistoryReadPolicy
      # Cap identity-policy permissions at dataset reads and this topic's publishing access.
      PermissionsBoundary:
        Ref: FrontendHistoryReadPolicy
      Tags:
        - Key: Application
          Value: serverless-api-usage-metering
        - Key: Purpose
          Value: Streamlit synthetic history reader

Outputs:
  FrontendHistoryBucket:
    Value:
      Ref: ReportsBucket
  FrontendHistoryPrefix:
    Value: ${self:custom.demoHistoryPrefix}
  FrontendHistoryManifestKey:
    Value: ${self:custom.demoHistoryPrefix}/manifest.json
  FrontendHistoryReadPolicyArn:
    Description: Dataset reads and one SNS topic only; no S3 write/list or API Gateway permissions
    Value:
      Ref: FrontendHistoryReadPolicy
  FrontendHistoryServiceUserName:
    Value:
      Ref: FrontendHistoryServiceUser
  FrontendHistoryServiceUserArn:
    Value:
      Fn::GetAtt: [FrontendHistoryServiceUser, Arn]
