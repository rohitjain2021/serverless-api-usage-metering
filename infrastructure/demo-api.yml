# Native CloudFormation resources imported by serverless.yml.
# Inputs: Serverless service/stage names and the customer identity conventions in the sample.
# Outputs: a metered REST endpoint, one shared plan, and three tagged customer key IDs.
# Real usage is generated by requests after deployment; historical sample counts are not uploaded.
Resources:
  DemoRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: ${self:service}-${sls:stage}-demo
      Description: Demo REST API for customer usage metering
      ApiKeySourceType: HEADER
      EndpointConfiguration:
        Types: [REGIONAL]

  DemoUsageResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: DemoRestApi
      ParentId:
        Fn::GetAtt: [DemoRestApi, RootResourceId]
      PathPart: usage-demo

  DemoUsageGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: DemoRestApi
      ResourceId:
        Ref: DemoUsageResource
      HttpMethod: GET
      # This endpoint returns only dummy data; API keys identify usage, not user authorization.
      AuthorizationType: NONE
      ApiKeyRequired: true
      # Return a small demo response directly from API Gateway, without an extra Lambda.
      Integration:
        Type: MOCK
        PassthroughBehavior: WHEN_NO_MATCH
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: >-
                {"message":"API usage demo request accepted","requestId":"$context.requestId"}
      MethodResponses:
        - StatusCode: '200'

  # A deployment is an API snapshot. Increment this logical ID when changing routes/integrations.
  DemoApiDeploymentV1:
    Type: AWS::ApiGateway::Deployment
    DependsOn: DemoUsageGetMethod
    Properties:
      RestApiId:
        Ref: DemoRestApi
      Description: Initial metered demo endpoint

  DemoApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId:
        Ref: DemoRestApi
      DeploymentId:
        Ref: DemoApiDeploymentV1
      StageName: ${sls:stage}
      # Avoid a continuously billed API cache for the small demonstration.
      CacheClusterEnabled: false
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  DemoUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: API Usage - Monthly Metering - ${sls:stage}
      Description: Shared demo access for all customers; no pricing tiers or billing rules
      ApiStages:
        - ApiId:
            Ref: DemoRestApi
          Stage:
            Ref: DemoApiStage
      # Match the sample's illustrative operational quota, applied separately to each key.
      # This is neither a free billing allowance nor a guaranteed spending cap.
      Quota:
        Limit: 10000
        Period: MONTH
      Throttle:
        RateLimit: 5
        BurstLimit: 10

  AcmeDemoApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: acme-${sls:stage}-api-key
      Description: Demo metering identity for Acme Ltd
      Enabled: true
      # Omitting Value lets AWS generate the secret; templates and outputs contain only IDs.
      Tags:
        - Key: customer_id
          Value: cust-001
        - Key: customer_name
          Value: Acme Ltd

  NorthwindDemoApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: northwind-${sls:stage}-api-key
      Description: Demo metering identity for Northwind Ltd
      Enabled: true
      Tags:
        - Key: customer_id
          Value: cust-002
        - Key: customer_name
          Value: Northwind Ltd

  ContosoDemoApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: contoso-${sls:stage}-api-key
      Description: Demo metering identity for Contoso Ltd
      Enabled: true
      Tags:
        - Key: customer_id
          Value: cust-003
        - Key: customer_name
          Value: Contoso Ltd

  # Explicit associations make each key valid for the shared plan and deployed API stage.
  AcmeDemoUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: AcmeDemoApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: DemoUsagePlan

  NorthwindDemoUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: NorthwindDemoApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: DemoUsagePlan

  ContosoDemoUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId:
        Ref: ContosoDemoApiKey
      KeyType: API_KEY
      UsagePlanId:
        Ref: DemoUsagePlan

Outputs:
  DemoApiUrl:
    Description: Send GET requests with a customer's x-api-key header to generate usage
    Value:
      Fn::Sub: https://${DemoRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${sls:stage}/usage-demo
  DemoRestApiId:
    Value:
      Ref: DemoRestApi
  DemoUsagePlanId:
    Value:
      Ref: DemoUsagePlan
  AcmeDemoApiKeyId:
    Value:
      Ref: AcmeDemoApiKey
  NorthwindDemoApiKeyId:
    Value:
      Ref: NorthwindDemoApiKey
  ContosoDemoApiKeyId:
    Value:
      Ref: ContosoDemoApiKey
