# Copy the non-secret outputs from your own deployed Serverless stack into this section.
[usage]
source = "s3"
region = "us-east-1"
bucket = "REPLACE_WITH_FRONTEND_HISTORY_BUCKET_OUTPUT"
prefix = "usage/demo/dataset=historical-2026-08_2026-10-v1"

# Copy ReportDownloadTopicArn from Serverless outputs to enable download-click notifications.
download_topic_arn = ""

# Locally, use your configured AWS profile/environment instead of storing keys here.
# For Community Cloud, use the deployed FrontendHistoryServiceUserName identity.
# Never commit the real secrets.toml or send credentials through chat.
# Replace these placeholders in Community Cloud Secrets with the dedicated IAM identity's credentials.
# Serverless attaches FrontendHistoryReadPolicy and the matching permissions boundary.
[aws]
access_key_id = "SET_IN_STREAMLIT_SECRETS_ONLY"
secret_access_key = "SET_IN_STREAMLIT_SECRETS_ONLY"

# Include the session token only when using temporary AWS credentials.
# session_token = "OPTIONAL_FOR_TEMPORARY_CREDENTIALS"
